<style>
:root{
  --bg:#0b0f14; --surface:#121821; --surface-2:#18202b; --line:#232d3a;
  --fg:#e9eef5; --muted:#8392a6; --accent:#ff9a52; --accent-soft:rgba(255,154,82,.15);
  --off:#3a4554; --warn:#ffb454; --ok:#5fd39a; --danger:#ff6b6b;
  --f-body:"Heebo",system-ui,sans-serif; --f-num:"Sora","Heebo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
input{user-select:text;-webkit-user-select:text}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:20px;font-weight:700;margin:0}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--ok)} .pill.bad .dot{background:var(--danger)}

.hero{position:relative;display:grid;place-items:center;padding-block:4px}
.glow{position:absolute;inset:8% 14%;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 68%);transition:opacity .5s;pointer-events:none}
.ring{width:min(100%,300px);aspect-ratio:1;max-width:100%;position:relative}
.ring>svg{width:100%;height:100%;display:block}
.track{stroke:var(--line);stroke-width:14;fill:none}
.val{stroke:var(--accent);stroke-width:14;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .4s}
.tick{stroke:var(--muted);stroke-width:2;opacity:.35}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:4px}
.icon{width:52px;height:44px;margin-bottom:6px}
.icon *{fill:none;stroke:var(--off);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.app.is-on .icon *{stroke:var(--accent)}
.app.is-on .icon .heat{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.time{font-family:var(--f-num);font-weight:200;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.state{font-size:14px;color:var(--accent);font-weight:500;transition:color .4s}
.hint{font-size:12px;color:var(--muted)}
.app:not(.is-on) .time,.app:not(.is-on) .state{color:var(--off)}
.app:not(.is-on) .val{stroke:var(--off)}
.app:not(.is-on) .glow{opacity:0}

.prow{display:flex;gap:8px}
.power{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);font-size:17px;font-weight:700;transition:background .4s,transform .12s}
.power:active,.ext:active{transform:scale(.98)}
.power:disabled{opacity:.6}
.app.is-on .power{background:var(--accent);color:#1a0d04;border-color:transparent}
.power svg{width:22px;height:22px}
.ext{flex:0 0 96px;border-radius:20px;background:var(--surface-2);border:1px solid var(--accent);color:var(--accent);font-family:var(--f-num);font-weight:600;font-size:16px;direction:ltr;transition:transform .12s}

.sec h2{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.6px;margin:0 0 8px}
.link{font-size:12.5px;color:var(--accent);letter-spacing:0;padding:2px 4px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:13px;color:var(--muted);transition:background .25s,color .25s}
.seg b{font-family:var(--f-num);font-weight:300;font-size:20px;font-variant-numeric:tabular-nums}
.seg span{font-size:11.5px}
.seg svg{width:22px;height:22px;margin-block:2px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.profiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);text-align:start;min-width:0;transition:transform .12s,border-color .25s}
.prof:active{transform:scale(.97)}
.prof svg{width:26px;height:26px;color:var(--accent);flex:none}
.prof div{min-width:0}
.prof b{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof span{font-size:11.5px;color:var(--muted)}
.prof[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:start;min-width:0;transition:border-color .25s,background .25s}
.tog .t{font-size:13.5px;font-weight:500}
.tog .s{font-size:11.5px;color:var(--muted)}
.tog svg{width:20px;height:20px;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tog[aria-pressed="true"] svg,.tog[aria-pressed="true"] .s{color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-weight:300;font-size:26px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat b.word{font-family:var(--f-body);font-size:17px;font-weight:500;line-height:31px}
.stat span{font-size:11.5px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;margin-top:10px;padding:10px 12px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;height:96px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:18px;border-radius:5px 5px 2px 2px;background:var(--accent);opacity:.85;min-height:3px}
.bar i.zero{background:var(--line);opacity:1}
.bar small{font-size:10.5px;color:var(--muted);padding-bottom:6px}
.bar.today small{color:var(--accent);font-weight:700}
.bar.future{opacity:.4}

.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0;padding:12px 14px;border:1px dashed var(--line);border-radius:14px}
.foot{display:flex;justify-content:center;gap:16px}
.foot button{font-size:12.5px;color:var(--muted);padding:6px}

.scrim{position:fixed;inset:0;background:rgba(3,6,10,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:460px;max-height:88%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:18px}
.sheet p,.sheet ol{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.sheet ol{padding-inline-start:20px}
.sheet ol b{color:var(--fg);font-weight:500}
.big{font-family:var(--f-num);font-size:44px;font-weight:300;text-align:center;direction:ltr}
.big small{font-size:16px;color:var(--muted);font-family:var(--f-body)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.row{display:flex;gap:8px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:#1a0d04;border:0}
.btn:disabled{opacity:.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.erow input{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);direction:ltr;text-align:left}
.erow input{direction:rtl;text-align:right}
.err-msg{color:var(--danger);font-size:13px;min-height:1px}
.qrbox{background:#fff;border-radius:16px;padding:10px;width:min(100%,260px);margin-inline:auto}
.qrbox svg{display:block;width:100%;height:auto}
.erow{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px}
.erow input{flex:1;min-width:0;padding:8px}
.stp{display:flex;align-items:center;gap:2px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stp button{width:32px;height:32px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:18px}
.stp span{min-width:42px;text-align:center;font-size:14px}
.del{width:32px;height:32px;border-radius:10px;color:var(--danger);display:grid;place-items:center}
.del svg{width:18px;height:18px}
.add{padding:12px;border-radius:14px;border:1px dashed var(--line);color:var(--accent);font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);text-align:start}
.opt span:last-child{color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.phrase{font-size:20px;font-weight:500;text-align:center;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.url{font-family:ui-monospace,monospace;font-size:11px;direction:ltr;text-align:left;word-break:break-all;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--muted);user-select:all;-webkit-user-select:all}

.done{position:fixed;inset:0;z-index:30;background:rgba(3,6,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding-inline:24px}
.done .card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--accent);border-radius:24px;padding:28px 22px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .icon{width:72px;height:60px}
.done .icon *{stroke:var(--accent)}
.done h3{margin:0;font-size:22px}
.done p{margin:0;color:var(--muted);font-size:14px}
.done .row{width:100%;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:40;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <h1>טוסטר</h1>
      <div class="sub" id="subline">תקע חכם</div>
    </div>
    <button class="pill" id="conn"><span class="dot"></span><span id="connTxt">מצב הדגמה</span></button>
  </header>

  <section class="hero">
    <div class="glow"></div>
    <div class="ring">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <g id="ticks"></g>
        <circle class="track" cx="150" cy="150" r="118"></circle>
        <circle class="val" id="val" cx="150" cy="150" r="118" transform="rotate(-90 150 150)"></circle>
      </svg>
      <div class="center">
        <svg class="icon" viewBox="0 0 52 44" aria-hidden="true">
          <path d="M14 18V9a5 5 0 0 1 10 0v9"/><path d="M28 18V9a5 5 0 0 1 10 0v9"/>
          <rect x="4" y="18" width="44" height="22" rx="7"/><path class="heat" d="M14 30h24"/>
        </svg>
        <div class="time" id="time">3:00</div>
        <div class="state" id="state">כבוי</div>
        <div class="hint" id="hint">בחר זמן והדלק</div>
      </div>
    </div>
  </section>

  <div class="prow">
    <button class="power" id="power" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      <span id="powerTxt">הדלק</span>
    </button>
    <button class="ext" id="ext" hidden aria-label="הוסף 30 שניות">+0:30</button>
  </div>

  <section class="sec">
    <h2>כיבוי אוטומטי</h2>
    <div class="seg" id="times"></div>
  </section>

  <section class="sec">
    <h2>פרופילים <button class="link" id="editProfiles">עריכה</button></h2>
    <div class="profiles" id="profiles"></div>
  </section>

  <section class="sec">
    <h2>פונקציות</h2>
    <div class="grid">
      <button class="tog" id="tNotify">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15Z"/><path d="M10 21h4"/></svg>
        <span class="t">התראה בסוף</span><span class="s" id="sNotify"></span>
      </button>
      <button class="tog" id="tSiri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        <span class="t">קיצור דרך ב-Siri</span><span class="s" id="sSiri"></span>
      </button>
    </div>
  </section>

  <section class="sec">
    <h2>מונה טוסטים</h2>
    <div class="stats">
      <div class="stat"><b id="stWeek">0</b><span>השבוע</span></div>
      <div class="stat"><b id="stTotal">0</b><span>סה״כ</span></div>
      <div class="stat"><b class="word" id="stFav">-</b><span>הכי נפוץ</span></div>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <p class="note" id="note">התקע מספק חשמל בלבד. אחרי ההדלקה צריך ללחוץ את הידית של הטוסטר, והתקע ינתק את החשמל כשהזמן נגמר.</p>
  <div class="foot"><button id="fDev">בחירת תקע</button><button id="fOut">התנתקות</button></div>
</div>

<script>
(function(){
const API='https://europe-west1-tab-fd9b6.cloudfunctions.net/kor';
const $=id=>document.getElementById(id);
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const buzz=(n=8)=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const LSset=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const CIRC=2*Math.PI*118;
$('val').style.strokeDasharray=CIRC;
const TIMES=[2,3,4,5];
const ICONS={
  bread:'<path d="M6 10a4 4 0 1 1 3-6.6A4 4 0 0 1 18 6a3 3 0 0 1 0 4v10H6Z"/>',
  bagel:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  frozen:'<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/>',
  warm:'<path d="M8 20c-2-3 2-5 0-8M12 20c-2-3 2-5 0-8M16 20c-2-3 2-5 0-8"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/>'
};
const DEF_PROFILES=[{n:'טוסט רגיל',m:3,ic:'bread'},{n:'בייגל',m:4,ic:'bagel'},{n:'לחם קפוא',m:5,ic:'frozen'},{n:'חימום קל',m:2,ic:'warm'}];
const DAY=86400000;

/* ---------- state ---------- */
let S={min:3,prof:-1,profiles:DEF_PROFILES,notify:true,siri:0,log:[]};
try{Object.assign(S,JSON.parse(LS('toaster_state')||'{}'))}catch(e){}
const save=()=>LSset('toaster_state',JSON.stringify(S));
// live run state (from the plug when connected, simulated in demo)
const R={on:false,endAt:0,total:S.min*60,busy:false};
const CFG={key:LS('toaster_key')||LS('kor_key')||'',dev:LS('toaster_dev')||''};
let linked=!!CFG.key, DEV=null, CAP=null, online=true;

/* ---------- api ---------- */
async function api(path,body){
  const r=await fetch(API+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},CFG.key?{'X-Kor-Key':CFG.key}:{}),body:JSON.stringify(body||{})});
  let j;try{j=await r.json()}catch(e){throw new Error('השרת לא ענה ('+r.status+')')}
  if(r.status===401){logout(true);throw new Error(j.error||'החיבור פג')}
  if(!j.ok)throw new Error(j.error||'שגיאה');
  return j;
}
const netMsg=e=>/fetch|load failed|network/i.test(e.message)?'אין חיבור לשרת. בדוק אינטרנט':e.message;

/* ---------- plug capabilities ---------- */
function caps(dev){
  const F={};(dev.functions||[]).forEach(f=>F[f.code]=f);
  const has=c=>c in F||c in (dev.status||{});
  const power=['switch_1','switch','switch_on','power'].find(has);
  const cd=['countdown_1','countdown','countdown_set'].find(c=>c in F);
  let cdMax=86400;try{cdMax=+(F[cd]?.values?.max)||86400}catch(e){}
  return {power,cd,cdMax};
}
function readStatus(st){
  if(!CAP)return;
  const on=!!st[CAP.power];
  const left=CAP.cd?+st[CAP.cd]||0:0;
  const was=R.on;
  if(on){
    if(CAP.cd&&left>0){const end=Date.now()+left*1000;if(!was||Math.abs(end-R.endAt)>3000)R.endAt=end;if(!was)R.total=Math.max(left,R.total||0)}
    else if(!was){R.endAt=0}
  }
  R.on=on;
  if(was&&!on&&R.endAt&&R.endAt-Date.now()<6000)finished(true);
  render();
}

/* ---------- connect ---------- */
function setConn(){
  const p=$('conn');p.classList.toggle('ok',linked&&!!DEV&&online);p.classList.toggle('bad',linked&&(!online||!DEV));
  $('connTxt').textContent=!linked?'מצב הדגמה':!DEV?'בחר תקע':online?'מחובר':'התקע לא מחובר';
  $('subline').textContent=DEV&&DEV.name&&DEV.name.trim()!=='טוסטר'?DEV.name:'תקע חכם';
  $('fDev').hidden=$('fOut').hidden=!linked;
}
async function loadDevices(pick){
  try{
    const j=await api('/devices');
    const plugs=j.devices.filter(d=>{const c=caps(d);return c.power&&!['kt','ktkzq','kts'].includes(d.category)});
    let d=plugs.find(x=>x.id===CFG.dev);
    if(!d&&!pick){d=plugs.find(x=>/טוסטר|toast/i.test(x.name))||(plugs.length===1?plugs[0]:null)}
    if(!d||pick)return pickDevice(plugs.length?plugs:j.devices);
    useDevice(d);
  }catch(e){toast(netMsg(e));setConn()}
}
function useDevice(d){
  DEV=d;CAP=caps(d);CFG.dev=d.id;LSset('toaster_dev',d.id);online=d.online!==false;
  $('note').textContent=CAP.cd?'התקע מספק חשמל בלבד. אחרי ההדלקה צריך ללחוץ את הידית של הטוסטר. הספירה רצה בתוך התקע עצמו, אז הוא ייכבה בזמן גם אם תסגור את האפליקציה.'
    :'התקע הזה לא תומך בספירה לאחור משלו, ולכן הכיבוי האוטומטי עובד רק כשהאפליקציה פתוחה.';
  readStatus(d.status||{});setConn();startPoll();
}
function pickDevice(list){
  sheet(`<h3>איזה תקע מחובר לטוסטר?</h3><div class="opts">${list.map(d=>`<button class="opt" data-id="${esc(d.id)}"><span>${esc(d.name||d.id)}</span><span>${d.online===false?'לא מחובר':''}</span></button>`).join('')||'<p>לא נמצאו מכשירים בחשבון.</p>'}</div>`,(el,close)=>{
    el.querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;close();useDevice(list.find(x=>x.id===b.dataset.id))};
  });
}
let pollT=null;
function startPoll(){clearInterval(pollT);pollT=setInterval(refresh,5000)}
let inFlight=false;
async function refresh(){
  if(!DEV||document.hidden||R.busy||inFlight)return;
  inFlight=true;
  try{const j=await api('/device',{id:DEV.id});if(j.device){online=j.device.online!==false;readStatus(j.device.status||{})}setConn()}catch(e){}
  finally{inFlight=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

function linkOk(key){CFG.key=key;LSset('toaster_key',key);linked=true;setConn();loadDevices()}
function logout(silent){CFG.key='';LSset('toaster_key',null);LSset('toaster_dev',null);linked=false;DEV=null;CAP=null;clearInterval(pollT);R.on=false;setConn();render();if(!silent)toast('התנתקת')}

function openConnect(){
  sheet(`<h3>חיבור לטוסטר</h3>
    <ol><li>ב-Smart Life: <b>אני ← הגדרות ← חשבון ואבטחה ← User Code</b></li><li>העתק את הקוד והדבק כאן</li></ol>
    <div class="field"><label for="uc">User Code</label><input id="uc" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(LS('kor_uc')||'')}"></div>
    <div class="err-msg" id="qerr"></div>
    <div class="row"><button class="btn" id="qb">${linked?'סגור':'המשך בהדגמה'}</button><button class="btn pri" id="qn">המשך</button></div>`,(el,close)=>{
    el.querySelector('#qb').onclick=close;
    el.querySelector('#qn').onclick=async()=>{const uc=el.querySelector('#uc').value.trim();if(!uc)return;
      const b=el.querySelector('#qn');b.disabled=true;b.textContent='רגע...';el.querySelector('#qerr').textContent='';
      try{const j=await api('/share/qr',{userCode:uc});LSset('kor_uc',uc);close();showQR(uc,j)}
      catch(e){el.querySelector('#qerr').textContent=netMsg(e);b.disabled=false;b.textContent='המשך'}};
  });
}
function showQR(uc,j){
  let stop=false;
  const close=sheet(`<h3>סרוק עם Smart Life</h3>
    <div class="qrbox" id="qrb"></div>
    <ol><li>צלם מסך עכשיו</li><li>ב-Smart Life: <b>אני ← סמל הסריקה למעלה ← אלבום</b>, ובחר את צילום המסך</li><li>אשר, וחזור לכאן</li></ol>
    <div class="err-msg" id="perr"></div>
    <button class="btn" id="qx">ביטול</button>`,(el,cl)=>{
    try{const q=qrcode(0,'Q');q.addData(j.qr);q.make();el.querySelector('#qrb').innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true})}
    catch(e){el.querySelector('#qrb').textContent=j.qr}
    el.querySelector('#qx').onclick=()=>{stop=true;cl()};
  });
  const t0=Date.now();
  (async function poll(){
    while(!stop&&document.querySelector('#qrb')){
      await new Promise(r=>setTimeout(r,2500));
      if(stop||!document.querySelector('#qrb'))return;
      if(Date.now()-t0>170000){const p=document.querySelector('#perr');if(p)p.textContent='הקוד פג. סגור ונסה שוב.';return}
      try{const r=await api('/share/poll',{userCode:uc,token:j.token});
        if(r.linked){close();linkOk(r.key);toast('מחובר');return}}catch(e){}
    }
  })();
}

/* ---------- commands ---------- */
function onCmds(sec){const c=[{code:CAP.power,value:true}];if(CAP.cd)c.push({code:CAP.cd,value:Math.min(CAP.cdMax,Math.round(sec))});return c}
async function send(cmds){
  R.busy=true;$('power').disabled=true;
  try{await api('/command',{id:DEV.id,commands:cmds});return true}
  catch(e){toast(netMsg(e));return false}
  finally{R.busy=false;$('power').disabled=false}
}
const live=()=>linked&&DEV&&CAP;

async function turnOn(name){
  const sec=S.min*60;
  if(live()&&!(await send(onCmds(sec))))return;
  R.on=true;R.total=sec;R.endAt=Date.now()+sec*1000;
  S.log.push({t:Date.now(),n:name||fmtMin(S.min)+' דק׳'});if(S.log.length>2000)S.log=S.log.slice(-2000);
  save();render();toast('התקע הודלק - לחץ את הידית');
}
async function turnOff(msg){
  if(live()&&!(await send([{code:CAP.power,value:false}])))return;
  R.on=false;R.endAt=0;render();if(msg)toast(msg);
}
async function extend(){
  if(!R.on)return;const left=Math.max(0,(R.endAt-Date.now())/1000)+30;
  if(live()&&CAP.cd&&!(await send([{code:CAP.cd,value:Math.min(CAP.cdMax,Math.round(left))}])))return;
  R.endAt=Date.now()+left*1000;R.total+=30;render();toast('נוספו 30 שניות');
}
function finished(fromPlug){
  R.on=false;R.endAt=0;render();buzz([120,80,120]);
  if(S.notify)showDone();else toast('הזמן נגמר - החשמל נותק');
}

/* ---------- ui ---------- */
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtMin=m=>m%1?(Math.floor(m)+':30'):String(m);
$('ticks').innerHTML=Array.from({length:60},(_,i)=>{const a=(i*6-90)*Math.PI/180,r1=i%5?96:92,r2=100;
  return`<line class="tick" x1="${150+r1*Math.cos(a)}" y1="${150+r1*Math.sin(a)}" x2="${150+r2*Math.cos(a)}" y2="${150+r2*Math.sin(a)}"/>`}).join('');

$('power').onclick=()=>{buzz();R.on?turnOff('הטוסטר כובה'):turnOn()};
$('ext').onclick=()=>{buzz();extend()};
$('times').onclick=e=>{const b=e.target.closest('button');if(!b)return;buzz();
  if(b.dataset.m==='custom')return openCustom();
  S.min=+b.dataset.m;S.prof=-1;save();render()};
$('profiles').onclick=e=>{const b=e.target.closest('.prof');if(!b)return;buzz();
  const p=S.profiles[b.dataset.p];S.min=p.m;S.prof=+b.dataset.p;save();
  if(R.on)turnOff().then(()=>turnOn(p.n));else turnOn(p.n)};
$('tNotify').onclick=()=>{buzz();S.notify=!S.notify;save();render();toast(S.notify?'התראה בסוף הופעלה':'התראה בסוף כובתה')};
$('tSiri').onclick=()=>{buzz();openSiri()};
$('editProfiles').onclick=()=>{buzz();openEdit()};
$('conn').onclick=()=>{buzz();linked?(DEV?refresh().then(()=>toast(online?'מחובר':'התקע לא מחובר')):loadDevices(true)):openConnect()};
$('fDev').onclick=()=>loadDevices(true);
$('fOut').onclick=()=>{sheet(`<h3>להתנתק?</h3><p>הטוסטר עצמו לא ישתנה. תצטרך לסרוק QR שוב כדי להתחבר.</p><div class="row"><button class="btn" id="nx">ביטול</button><button class="btn pri" id="ny">התנתק</button></div>`,(el,close)=>{
  el.querySelector('#nx').onclick=close;el.querySelector('#ny').onclick=()=>{close();logout()}})};

function sheet(html,init){
  const sc=document.createElement('div');sc.className='scrim';sc.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;
  document.body.appendChild(sc);const close=()=>sc.remove();sc.onclick=e=>{if(e.target===sc)close()};
  init&&init(sc,close);return close;
}
function openCustom(){
  sheet(`<h3>כיבוי אחרי</h3><div class="big"><span id="sv"></span> <small>דקות</small></div>
    <input type="range" id="sr" min="1" max="15" step="1" value="${Math.round(S.min)}" aria-label="דקות">
    <div class="row"><button class="btn" id="sc">ביטול</button><button class="btn pri" id="ss">שמור</button></div>`,(sc,close)=>{
    const sr=sc.querySelector('#sr'),sv=sc.querySelector('#sv');sv.textContent=sr.value;
    sr.oninput=()=>{sv.textContent=sr.value;buzz()};
    sc.querySelector('#sc').onclick=close;
    sc.querySelector('#ss').onclick=()=>{S.min=+sr.value;S.prof=-1;save();render();close()};
  });
}
function openEdit(){
  let draft=S.profiles.map(p=>({...p}));
  sheet(`<h3>עריכת פרופילים</h3><div id="elist" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="add" id="eadd">+ פרופיל חדש</button>
    <div class="row"><button class="btn" id="ec">ביטול</button><button class="btn pri" id="es">שמור</button></div>`,(sc,close)=>{
    const list=sc.querySelector('#elist');
    const draw=()=>{list.innerHTML=draft.map((p,i)=>`<div class="erow" data-i="${i}">
        <input id="pn${i}" value="${esc(p.n)}" maxlength="18" aria-label="שם הפרופיל">
        <div class="stp"><button data-a="-" aria-label="פחות">−</button><span>${fmtMin(p.m)}′</span><button data-a="+" aria-label="יותר">+</button></div>
        <button class="del" data-a="x" aria-label="מחק">${svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>')}</button></div>`).join('');
      sc.querySelector('#eadd').hidden=draft.length>=6};
    const sync=()=>draft.forEach((p,i)=>{const el=list.querySelector('#pn'+i);if(el)p.n=el.value.trim()||p.n});
    list.onclick=e=>{const b=e.target.closest('button');if(!b)return;sync();const i=+b.closest('.erow').dataset.i;buzz();
      if(b.dataset.a==='+')draft[i].m=Math.min(15,draft[i].m+.5);
      if(b.dataset.a==='-')draft[i].m=Math.max(.5,draft[i].m-.5);
      if(b.dataset.a==='x')draft.splice(i,1);draw()};
    sc.querySelector('#eadd').onclick=()=>{sync();draft.push({n:'פרופיל חדש',m:3,ic:'star'});draw();list.querySelector('#pn'+(draft.length-1))?.select()};
    sc.querySelector('#ec').onclick=close;
    sc.querySelector('#es').onclick=()=>{sync();S.profiles=draft;if(S.prof>=draft.length)S.prof=-1;if(S.siri>=draft.length)S.siri=0;save();render();close();toast('הפרופילים נשמרו')};
    draw();
  });
}
const b64url=o=>btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function openSiri(){
  if(!live())return sheet(`<h3>קיצור דרך ב-Siri</h3><p>קודם צריך לחבר את הטוסטר. אחרי החיבור תקבל כאן קישור להוספה לקיצורים.</p><button class="btn pri" id="sc">חבר עכשיו</button>`,(el,close)=>{el.querySelector('#sc').onclick=()=>{close();openConnect()}});
  const close0=sheet('<h3>קיצור דרך ב-Siri</h3><p>מכין קישור...</p>');
  let tok;try{tok=(await api('/token',{})).token}catch(e){close0();return toast(netMsg(e))}
  close0();
  const urlFor=p=>API+'/act?k='+encodeURIComponent(tok)+'&d='+encodeURIComponent(DEV.id)+'&c='+b64url(onCmds(p.m*60))+'&s='+encodeURIComponent('הטוסטר דולק ל-'+fmtMin(p.m)+' דקות');
  sheet(`<h3>קיצור דרך ב-Siri</h3>
    <div class="phrase">"היי סירי, טוסט"</div>
    <p>בחר איזה פרופיל הפקודה תפעיל:</p>
    <div class="opts" id="sopts">${S.profiles.map((p,i)=>`<button class="opt" data-i="${i}" aria-pressed="${i===S.siri}"><span>${esc(p.n)}</span><span>${fmtMin(p.m)} דק׳</span></button>`).join('')}</div>
    <ol><li>העתק את הקישור</li><li>באפליקציית <b>קיצורים</b>: <b>+ ← הוסף פעולה ← קבל תוכן של URL</b>, והדבק</li><li>קרא לקיצור <b>טוסט</b></li></ol>
    <div class="url" id="surl"></div>
    <div class="row"><button class="btn" id="sx">סגור</button><button class="btn pri" id="scp">העתק קישור</button></div>`,(sc,close)=>{
    const upd=()=>{sc.querySelector('#surl').textContent=urlFor(S.profiles[S.siri]||S.profiles[0])};upd();
    sc.querySelector('#sopts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;buzz();S.siri=+b.dataset.i;save();render();
      sc.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));upd()};
    sc.querySelector('#sx').onclick=close;
    sc.querySelector('#scp').onclick=()=>{const t=sc.querySelector('#surl').textContent;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('הקישור הועתק')).catch(()=>{
        const r=document.createRange();r.selectNodeContents(sc.querySelector('#surl'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('סמן והעתק ידנית')})};
  });
}
function showDone(){
  document.querySelector('.done')?.remove();
  const d=document.createElement('div');d.className='done';
  d.innerHTML=`<div class="card" role="alertdialog" aria-label="הטוסט מוכן">
    <svg class="icon" viewBox="0 0 52 44" aria-hidden="true"><path d="M14 14V5a5 5 0 0 1 10 0v9"/><path d="M28 14V5a5 5 0 0 1 10 0v9"/><rect x="4" y="18" width="44" height="22" rx="7"/></svg>
    <h3>הטוסט מוכן</h3><p>החשמל נותק</p>
    <div class="row"><button class="btn" id="dAgain">עוד אחד</button><button class="btn pri" id="dOk">תודה</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#dOk').onclick=()=>d.remove();
  d.querySelector('#dAgain').onclick=()=>{d.remove();turnOn(S.prof>=0?S.profiles[S.prof]?.n:undefined)};
}
let tt;function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),2200)}

function renderStats(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const weekStart=today-now.getDay()*DAY;
  $('stWeek').textContent=S.log.filter(x=>x.t>=weekStart).length;
  $('stTotal').textContent=S.log.length;
  const cnt={};S.log.forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1);
  $('stFav').textContent=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-';
  const DN=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const days=Array.from({length:7},(_,i)=>{const s=weekStart+i*DAY;return{l:DN[i],t:s===today,f:s>today,c:S.log.filter(x=>x.t>=s&&x.t<s+DAY).length}});
  const max=Math.max(1,...days.map(d=>d.c));
  $('bars').innerHTML=days.map(d=>`<div class="bar${d.t?' today':''}${d.f?' future':''}"><i class="${d.c?'':'zero'}" style="height:${d.c?Math.round(d.c/max*48):3}px"></i><small>${d.l}</small></div>`).join('');
}
function drawClock(){
  const timed=R.on&&R.endAt;
  const left=timed?R.endAt-Date.now():(R.on?0:S.min*60000);
  $('time').textContent=R.on&&!timed?'--:--':fmt(left);
  $('val').style.strokeDashoffset=timed?CIRC*(1-left/(R.total*1000)):(R.on?0:0);
}
function render(){
  $('app').classList.toggle('is-on',R.on);
  drawClock();
  $('state').textContent=R.on?'דולק':'כבוי';
  $('hint').textContent=R.on?(R.endAt?'כיבוי אוטומטי בסוף הספירה':'אין טיימר פעיל'):'בחר זמן והדלק';
  $('power').setAttribute('aria-pressed',R.on);$('powerTxt').textContent=R.on?'כבה עכשיו':'הדלק';
  $('ext').hidden=!R.on||!R.endAt;
  const isCustom=!TIMES.includes(S.min)&&S.prof<0;
  $('times').innerHTML=TIMES.map(m=>`<button data-m="${m}" aria-pressed="${S.min===m&&S.prof<0}"><b>${m}</b><span>דק׳</span></button>`).join('')+
    `<button data-m="custom" aria-pressed="${isCustom}">${isCustom?`<b>${fmtMin(S.min)}</b><span>דק׳</span>`:svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>')+'<span>אחר</span>'}</button>`;
  $('profiles').innerHTML=S.profiles.map((p,i)=>`<button class="prof" data-p="${i}" aria-pressed="${R.on&&i===S.prof}">${svg(ICONS[p.ic]||ICONS.star)}<div><b>${esc(p.n)}</b><span>${fmtMin(p.m)} דק׳</span></div></button>`).join('');
  $('tNotify').setAttribute('aria-pressed',S.notify);$('sNotify').textContent=S.notify?'פעיל':'כבוי';
  $('sSiri').textContent=S.profiles[S.siri]?'"טוסט" - '+S.profiles[S.siri].n:'לא הוגדר';
  renderStats();
}
setInterval(()=>{if(R.on&&R.endAt){
  if(Date.now()>=R.endAt){
    if(!live())finished();
    else if(!CAP.cd)turnOff().then(()=>finished());
    else refresh();
  }else drawClock()}},500);

render();setConn();
if(linked)loadDevices();else setTimeout(openConnect,400);
})();
</script>
</body>
</html>
